<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1f2f4">
  <meta name="description" content="An interactive 3D unboxing experience.">
  <title>Unboxing</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img id="brand-logo" alt="" hidden><h1 id="brand-name">Unboxing</h1></div>
    <nav aria-label="Player controls">
      <a id="course-link" href="./course/" hidden>Course &amp; downloads</a>
      <button id="record" type="button" aria-pressed="false" disabled>Record opening</button>
      <button id="sound" type="button" aria-pressed="true">Sound on</button>
      <button id="language" type="button" lang="zh-CN">中文</button>
    </nav>
  </header>
  <main id="stage" aria-label="Interactive 3D unboxing" data-loading="true">
    <canvas id="scene" tabindex="0" aria-label="Drag to unwrap. After the reveal, drag to rotate and scroll to zoom."></canvas>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="fatal" role="alert" hidden><p id="fatal-message"></p><button id="reload" type="button">Reload</button></div>
    <section id="interaction" class="interaction" aria-live="polite">
      <h2 id="instruction">Preparing your box…</h2>
      <div class="progress-track" aria-hidden="true"><span id="progress"></span></div>
      <button id="action" class="primary-button" type="button" disabled>Loading…</button>
      <p id="interaction-hint">Drag with your mouse or finger, or use the button.</p>
    </section>
    <section id="result" class="result" aria-live="polite" hidden>
      <h2 id="result-name"></h2>
      <p id="inspect-hint">Drag to rotate · Release to return · Scroll to zoom</p>
      <div class="result-actions"><button id="again" class="primary-button" type="button">Open another</button><button id="download-model" class="secondary-button" type="button" hidden>Download model</button></div>
    </section>
    <p id="odds-note" class="odds-note">Every model has an equal chance.</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
